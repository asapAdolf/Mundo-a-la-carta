<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundo a la Carta - Programar Transporte</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen m-0 p-0 flex flex-col justify-between">

  <div class="w-full bg-white shadow-2xl overflow-hidden relative min-h-screen flex flex-col">

    <!-- Encabezado con la curva SVG exacta y ancho completo -->
    <div class="bg-wave text-white pt-6 pb-24 px-8 md:px-16 relative w-full">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center space-x-3">
          <i class="fa-solid fa-globe text-3xl"></i>
          <span class="font-bold text-xl tracking-wider">MUNDO<span class="font-light">A LA CARTA</span></span>
        </div>
        <nav class="hidden md:flex items-center space-x-8 font-semibold text-sm">
          <span class="border-b-2 border-white pb-1">Transporte</span>
          <a href="#" class="hover:opacity-80">Inicio</a>
          <a href="#" class="hover:opacity-80">Experiencias</a>
          <a href="#" class="hover:opacity-80">Contacto</a>
          <i class="fa-solid fa-magnifying-glass cursor-pointer"></i>
          <i class="fa-solid fa-bars cursor-pointer text-lg"></i>
        </nav>
      </div>

      <h1 class="text-3xl md:text-5xl font-bold leading-tight drop-shadow-md">
        1. Programar <br> Transporte
      </h1>

      <!-- Curva SVG exacta estirada a todo el ancho -->
      <svg class="absolute bottom-0 left-0 w-full h-[120px]" viewBox="0 0 1440 120" fill="none" preserveAspectRatio="none">
        <path d="M0 120L48 105C96 90 192 60 288 45C384 30 480 30 576 40C672 50 768 70 864 75C960 80 1056 70 1152 55C1248 40 1344 20 1392 10L1440 0V120H0Z" fill="white"/>
      </svg>
    </div>

    <!-- Contenido principal expandido -->
    <div class="px-8 md:px-16 py-8 flex-1 flex flex-col justify-between">
      <div>
        <!-- Buscador de folio flotante superior derecha -->
        <div class="flex justify-end mb-8">
          <div class="bg-gray-50 border border-orange-200 p-5 rounded-2xl shadow-md w-full max-w-sm">
            <label class="block text-xs font-semibold text-gray-700 mb-1">Ingresa Folio de Reservación <span class="text-red-500">*</span></label>
            <input type="text" class="input-field mb-2" placeholder="s(150)">
            <span class="block text-[0.65rem] text-gray-500 mb-3">Valida que el folio exista en la BD y que su estado sea apto.</span>
            <div class="flex gap-2">
              <button class="bg-orange-500 hover:bg-orange-600 text-white font-semibold text-xs py-2 px-5 rounded-full">Buscar</button>
              <button class="bg-gray-500 hover:bg-gray-600 text-white font-semibold text-xs py-2 px-5 rounded-full">Regresar</button>
            </div>
          </div>
        </div>

        <div class="text-center mb-8">
          <h3 class="font-bold text-gray-800 text-xl">Formulario de Datos</h3>
        </div>

        <!-- Formulario de 3 columnas ancho completo -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12 max-w-7xl mx-auto w-full">
          <div class="flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-2 text-center">Direccion <span class="text-red-500">(S)</span></label>
            <input type="text" class="input-field text-center py-3" placeholder="s(150)">
          </div>
          <div class="flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-2 text-center">Cantidad Pasajeros <span class="text-red-500">(i)</span></label>
            <input type="text" class="input-field text-center py-3" placeholder="int (15)">
          </div>
          <div class="flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-2 text-center">Hora Regreso <span class="text-red-500">(Time)</span></label>
            <input type="text" class="input-field text-center py-3" placeholder="00:00 Hrs">
          </div>
        </div>
      </div>

      <!-- Botones de Acción -->
      <div class="flex flex-wrap justify-center gap-6 pb-8">
        <button onclick="window.location.href='pantalla2-recojo-cliente.html'" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 px-16 rounded-full shadow-lg text-lg">Agendar</button>
        <button class="bg-red-500 hover:bg-red-600 text-white font-semibold py-3 px-16 rounded-full shadow-lg text-lg">CANCELAR</button>
      </div>

    </div>
  </div>

  <script src="/js/transporte.js"></script>
</body>
</html>
