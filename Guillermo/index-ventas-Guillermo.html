<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vender y Pagar Souvenirs - Guillermo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .bg-wave { background: linear-gradient(135deg, #FF8C00 0%, #FFA500 100%); }
    .screen-content { display: none !important; }
    .screen-content.active { display: grid !important; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 md:p-6">

  <div class="w-full max-w-5xl bg-white shadow-2xl rounded-2xl overflow-hidden relative">

    <div class="bg-wave text-white pt-6 pb-16 px-6 md:px-10 relative">
      <div class="flex items-center space-x-3 mb-8">
        <i class="fa-solid fa-globe text-3xl"></i>
        <span class="font-bold text-xl tracking-wider">MUNDO<span class="font-light">A LA CARTA</span></span>
      </div>
      <h1 id="main-title" class="text-3xl md:text-4xl font-bold leading-tight drop-shadow-md">
        Vender <br> souvenirs
      </h1>
      <svg class="absolute bottom-0 left-0 w-full" viewBox="0 0 1440 120" fill="none">
        <path d="M0 120L48 105C96 90 192 60 288 45C384 30 480 30 576 40C672 50 768 70 864 75C960 80 1056 70 1152 55C1248 40 1344 20 1392 10L1440 0V120H0Z" fill="white"/>
      </svg>
    </div>

    <div class="px-6 md:px-10 py-8 flex flex-col md:flex-row gap-8">

      <div class="flex md:flex-col gap-5 text-2xl text-gray-400 justify-center">
        <button id="btn-venta" onclick="switchScreen('venta')"
          class="nav-btn p-3 rounded-full text-orange-500 bg-orange-100 shadow-sm" title="Vender">
          <i class="fa-solid fa-cart-shopping"></i>
        </button>
        <button id="btn-efectivo" onclick="switchScreen('efectivo')"
          class="nav-btn p-3 rounded-full hover:text-orange-500" title="Cobro efectivo">
          <i class="fa-solid fa-money-bill-wave"></i>
        </button>
        <button id="btn-tarjeta" onclick="switchScreen('tarjeta')"
          class="nav-btn p-3 rounded-full hover:text-orange-500" title="Cobro tarjeta">
          <i class="fa-solid fa-credit-card"></i>
        </button>
      </div>

      <div class="flex-1">

        <!-- PANTALLA 1: VENDER -->
        <div id="venta-screen" class="screen-content active grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">
          <div class="flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1 ml-2">Cliente <span class="text-red-500">*</span></label>
            <input id="cliente" type="text" placeholder="Nombre del cliente"
              class="bg-orange-50 border border-orange-200 rounded-full px-5 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400">
          </div>
          <div class="flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1 ml-2">Precio unitario</label>
            <div class="bg-orange-50 border border-orange-200 text-orange-600 font-semibold rounded-full px-5 py-2">
              $<span id="precio-unitario">0.00</span>
            </div>
          </div>
          <div class="flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1 ml-2">Souvenir <span class="text-red-500">*</span></label>
            <select id="souvenir" class="bg-orange-50 border border-orange-200 rounded-full px-5 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400">
              <option value="">Seleccione souvenir</option>
              <option value="150">Llavero VR</option>
              <option value="280">Gorra Mundo a la Carta</option>
              <option value="120">Taza temática</option>
              <option value="95">Llavero mini</option>
            </select>
          </div>
          <div class="flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1 ml-2">Subtotal</label>
            <div class="bg-orange-50 border border-orange-200 text-orange-600 font-semibold rounded-full px-5 py-2">
              $<span id="subtotal">0.00</span>
            </div>
          </div>
          <div class="flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1 ml-2">Cantidad <span class="text-red-500">*</span></label>
            <input id="cantidad" type="number" min="1" value="1"
              class="bg-orange-50 border border-orange-200 rounded-full px-5 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400">
          </div>
          <div class="col-span-1 md:col-span-2 flex flex-wrap gap-4 mt-4">
            <button onclick="irACobro('efectivo')"
              class="bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 px-8 rounded-full shadow-md">
              Pagar en efectivo
            </button>
            <button onclick="irACobro('tarjeta')"
              class="bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 px-8 rounded-full shadow-md">
              Pagar con tarjeta
            </button>
            <button onclick="reiniciar()"
              class="bg-orange-200 hover:bg-orange-300 text-orange-800 font-semibold py-2 px-8 rounded-full shadow-md">
              Regresar
            </button>
          </div>
        </div>

        <!-- PANTALLA 2: COBRO EFECTIVO -->
        <div id="efectivo-screen" class="screen-content grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">
          <div class="flex flex-col md:col-span-2">
            <label class="text-sm font-semibold text-gray-700 mb-1 ml-2">Total a pagar</label>
            <div class="text-3xl font-bold text-orange-500 ml-2">$<span id="total-efectivo">0.00</span></div>
          </div>
          <div class="flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1 ml-2">Monto recibido <span class="text-red-500">*</span></label>
            <input id="monto-recibido" type="number" step="0.01" min="0" placeholder="0.00"
              class="bg-orange-50 border border-orange-200 rounded-full px-5 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400">
          </div>
          <div class="flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1 ml-2">Cambio</label>
            <div class="text-2xl font-bold text-green-600 ml-2">$<span id="cambio">0.00</span></div>
          </div>
          <div class="col-span-1 md:col-span-2 flex flex-wrap gap-4 mt-4">
            <button onclick="cobrarEfectivo()"
              class="bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 px-8 rounded-full shadow-md">Cobrar</button>
            <button onclick="switchScreen('venta')"
              class="bg-orange-200 hover:bg-orange-300 text-orange-800 font-semibold py-2 px-8 rounded-full">Cancelar</button>
          </div>
        </div>

        <!-- PANTALLA 3: COBRO TARJETA -->
        <div id="tarjeta-screen" class="screen-content grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">
          <div class="flex flex-col md:col-span-2">
            <label class="text-sm font-semibold text-gray-700 mb-1 ml-2">Total a pagar</label>
            <div class="text-3xl font-bold text-orange-500 ml-2">$<span id="total-tarjeta">0.00</span></div>
          </div>
          <div class="flex flex-col md:col-span-2">
            <label class="text-sm font-semibold text-gray-700 mb-1 ml-2">Nombre del titular <span class="text-red-500">*</span></label>
            <input id="titular" type="text" placeholder="Nombre como aparece en la tarjeta"
              class="bg-orange-50 border border-orange-200 rounded-full px-5 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400">
          </div>
          <div class="flex flex-col md:col-span-2">
            <label class="text-sm font-semibold text-gray-700 mb-1 ml-2">Número de tarjeta <span class="text-red-500">*</span></label>
            <input id="num-tarjeta" type="text" maxlength="19" placeholder="**** **** **** ****"
              class="bg-orange-50 border border-orange-200 rounded-full px-5 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400">
          </div>
          <div class="flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1 ml-2">Vencimiento <span class="text-red-500">*</span></label>
            <input id="vencimiento" type="text" maxlength="5" placeholder="MM/AA"
              class="bg-orange-50 border border-orange-200 rounded-full px-5 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400">
          </div>
          <div class="flex flex-col">
            <label class="text-sm font-semibold text-gray-700 mb-1 ml-2">CVV <span class="text-red-500">*</span></label>
            <input id="cvv" type="text" maxlength="4" placeholder="123"
              class="bg-orange-50 border border-orange-200 rounded-full px-5 py-2 focus:outline-none focus:ring-2 focus:ring-orange-400">
          </div>
          <div class="col-span-1 md:col-span-2 flex flex-wrap gap-4 mt-4">
            <button onclick="cobrarTarjeta()"
              class="bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 px-8 rounded-full shadow-md">Cobrar</button>
            <button onclick="switchScreen('venta')"
              class="bg-orange-200 hover:bg-orange-300 text-orange-800 font-semibold py-2 px-8 rounded-full">Cancelar</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="js/ventas-Guillermo.js"></script>
</body>
</html>
